name: terraform-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Format
        run: terraform fmt -recursive -check -diff

      - name: Validate bootstrap
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate dev (registry module; requires TF_API_TOKEN secret)
        if: ${{ secrets.TF_API_TOKEN != '' }}
        working-directory: dev
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Dev skipped without TF_API_TOKEN
        if: ${{ secrets.TF_API_TOKEN == '' }}
        run: |
          echo "Set repo secret TF_API_TOKEN (Terraform Cloud user/team token) to validate dev/ with private module aks/azurerm."
