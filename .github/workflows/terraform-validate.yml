name: terraform-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Environments use the module through a relative path (../../terraform-azure-aks-module),
      # so both repos are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: terraform-azure-aks-clusters-weu

      - uses: actions/checkout@v4
        with:
          repository: ShokryPlatForge/terraform-azure-aks-module
          path: terraform-azure-aks-module

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"

      - name: Format
        working-directory: terraform-azure-aks-clusters-weu
        run: terraform fmt -recursive -check -diff

      - name: Validate bootstrap
        working-directory: terraform-azure-aks-clusters-weu/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate and plan-test every environment (mocked, no Azure access)
        working-directory: terraform-azure-aks-clusters-weu
        run: |
          for dir in $(dirname $(ls */remote_backend.tf)); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
